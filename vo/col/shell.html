<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>ติดตามหนี้รายเดือน AM2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f6;--card:#fff;--ink:#14213d;--muted:#6b7488;--line:#e6e9f0;--navy:#1f3a68;--red:#c8102e;--chip:#e9eef8;
--ok:#1f9d55;--od1:#e3a33b;--od2:#e07b39;--od3:#d1495b;--npl:#8e1b2b;--cur:#5b8bd6;--closed:#b8bfcc;--good:#1f9d55;--bad:#c8102e;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1420;--card:#172033;--ink:#e6ebf5;--muted:#97a1b6;--line:#263149;--navy:#8fb0e8;--chip:#22304d;--cur:#6f9be0;--closed:#4b556b;--npl:#d0566a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1420;--card:#172033;--ink:#e6ebf5;--muted:#97a1b6;--line:#263149;--navy:#8fb0e8;--chip:#22304d;--cur:#6f9be0;--closed:#4b556b;--npl:#d0566a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Thai',-apple-system,'Segoe UI',sans-serif;font-size:14px;line-height:1.45}
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header.fopen{position:relative}
.hbar{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand img{height:30px}
.brand b{font-size:16px;color:var(--navy);white-space:nowrap}
.brand span{color:var(--muted);font-size:12px;display:block}
select,input{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 10px;min-height:36px}
.seg{display:inline-flex;background:var(--chip);border-radius:10px;padding:3px}
.seg button{font:inherit;border:0;background:transparent;color:var(--muted);padding:5px 12px;border-radius:8px;cursor:pointer;font-weight:500}
.seg button.on{background:var(--card);color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.12)}
nav{max-width:1180px;margin:0 auto;padding:0 16px;display:flex;gap:4px;overflow-x:auto}
nav button{font:inherit;border:0;background:none;color:var(--muted);padding:10px 12px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;font-weight:500}
nav button.on{color:var(--red);border-color:var(--red)}
main{max-width:1180px;margin:0 auto;padding:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.k{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.k .l{color:var(--muted);font-size:12px}
.k .v{font-size:22px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.k .d{font-size:12px;margin-top:2px;color:var(--muted)}
.up{color:var(--bad)}.down{color:var(--good)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:15px;color:var(--navy)}
.card h3 small{color:var(--muted);font-weight:400;font-size:12px;margin-left:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
@media (max-width:820px){.grid2{grid-template-columns:1fr}}
.stack{display:flex;height:22px;border-radius:8px;overflow:hidden;background:var(--chip)}
.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:12px;color:var(--muted)}
.legend span::before{content:'';display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--c);margin-right:5px;vertical-align:-1px}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:13px}
th,td{padding:7px 9px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:500;font-size:12px;cursor:pointer;user-select:none;background:var(--card);position:sticky;top:0}
th.s::after{content:' ▾'}th.s.asc::after{content:' ▴'}
td:first-child,th:first-child{text-align:left;position:sticky;left:0;background:var(--card);z-index:1}
td.t{text-align:left}
tr.tot td{font-weight:700;border-top:2px solid var(--line)}
tbody tr:hover td{background:var(--chip)}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:600}
.hi{background:rgba(200,16,46,.12);color:var(--bad)}.mid{background:rgba(227,163,59,.18);color:#a26a10}.lo{background:rgba(31,157,85,.12);color:var(--good)}
.bars .r{display:grid;grid-template-columns:minmax(70px,130px) 1fr 54px;gap:8px;align-items:center;margin:5px 0;font-size:12.5px}
.bars .r .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bars .r .b{height:14px;background:var(--chip);border-radius:6px;overflow:hidden}
.bars .r .b i{display:block;height:100%;background:var(--red);border-radius:6px}
.bars .r .x{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.filters input{flex:1;min-width:160px}
.muted{color:var(--muted)}
.sm{font-size:11.5px;color:var(--muted);font-weight:400;max-width:190px;overflow:hidden;text-overflow:ellipsis}
.empty{padding:40px;text-align:center;color:var(--muted)}
svg text{fill:var(--muted);font-size:11px;font-family:inherit}
.note{font-size:12px;color:var(--muted);margin-top:6px}
.who{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.who select{flex:1;min-width:220px}
.cmp .g{margin-bottom:12px}.cmp .h{font-weight:600;font-size:13px;margin-bottom:4px}
.cmp .r{display:grid;grid-template-columns:96px 1fr 62px;gap:8px;align-items:center;margin:4px 0;font-size:12.5px}
.cmp .r .n{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmp .b{height:14px;background:var(--chip);border-radius:6px;overflow:hidden}.cmp .b i{display:block;height:100%;border-radius:6px}
.cmp .x{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
footer{max-width:1180px;margin:0 auto;padding:4px 16px 30px;color:var(--muted);font-size:12px}
.ftog{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--chip);color:var(--navy);border-radius:10px;padding:7px 12px;cursor:pointer;position:relative;min-height:36px}
.ftog .arw{font-size:10px;display:inline-block;transition:transform .2s}.ftog[aria-expanded="true"] .arw{transform:rotate(180deg)}
.fdot{position:absolute;top:-3px;right:-3px;width:10px;height:10px;border-radius:50%;background:var(--red);border:2px solid var(--card);display:none}.fdot.on{display:block}
.fpanel{max-width:1180px;margin:0 auto;padding:4px 16px 12px}
.fsec{margin-top:10px}.fl{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
.ftgs{display:flex;flex-wrap:wrap;gap:10px 22px}.ftg .fl{margin-bottom:4px}
.fgrid{display:grid;gap:8px}.fgrid.c5{grid-template-columns:repeat(5,minmax(0,1fr))}.fgrid.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:820px){.fgrid.c5{grid-template-columns:repeat(2,minmax(0,1fr))}.fgrid.c2{grid-template-columns:1fr}}
.fgrid select,.fgrid input{width:100%;min-width:0}
.fgrid .hv{background:#fef9c3;color:#14213d;border-color:#e8d97a}
.ffoot{display:flex;justify-content:flex-end}.freset{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:7px 14px;cursor:pointer}
.fstatus[hidden]{display:none}
.fstatus{max-width:1180px;margin:0 auto;padding:6px 16px 8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.fchip{display:inline-flex;align-items:center;gap:6px;background:#fef9c3;color:#14213d;border:1px solid #e8d97a;border-radius:99px;padding:2px 4px 2px 10px;font-weight:500}
.fchip button{font:inherit;border:0;background:rgba(0,0,0,.08);border-radius:99px;width:20px;height:20px;cursor:pointer;line-height:1}
</style>
</head>

}
function fText(k) {
  const f = S.f[k], r = flat(S.m).find(x => (k === 'emp' ? x.team + '|' + x.emp : x[k]) === f) || {};
  return k === 'maker' ? (f === 'emp' ? 'พนักงาน CK/BK/AG' : 'ร้านทำเคส') : k === 'am' ? amLabel(f) : k === 'hub' ? hubLabel(f)
    : k === 'team' ? f + (r.teamName ? ' ' + r.teamName : '') : k === 'emp' ? (r.name || f) : k === 'dealer' ? (r.dealerName || f) : k === 'show' ? (r.showName || f) : f;
}
const fval = (k, r) => k === 'maker' ? maker(r) : k === 'emp' ? r.team + '|' + r.emp : r[k];
function syncFilters() {
  // ตัวกรองที่ไม่มีข้อมูลในเดือน/ขอบเขตนี้ → ล้างทีละตัว เริ่มจากตัวที่ละเอียดที่สุด (Showroom → Dealer → ... → AM)
  for (const k of ['show', 'dealer', 'emp', 'pos', 'team', 'hub', 'am', 'maker'])
    if (S.f[k] && !flat(S.m).some(r => pass(r, k) && fval(k, r) === S.f[k])) S.f[k] = '';
  fill('fAm', 'am', 'AM ทั้งหมด', opts('am', '', r => r.am, r => amLabel(r.am)));
  fill('fHub', 'hub', 'Hub RM ทั้งหมด', opts('hub', '', r => r.hub, r => hubLabel(r.hub)));
  fill('fTeam', 'team', 'ทุกทีม', opts('team', '', r => r.team, r => r.team + (r.teamName ? ' ' + r.teamName : '')));
  fill('fPos', 'pos', 'ทุกตำแหน่ง', opts('pos', '', r => r.pos, r => r.pos));
  fill('fEmp', 'emp', 'ทุก CK/BK/AG', opts('emp', '', r => r.team + '|' + r.emp, r => r.name + (r.nick ? ' (' + r.nick + ')' : '') + ' · ' + r.team));
  const dl = opts('dealer', '', r => r.dealer, r => r.dealerName || r.dealer);
  $('#dealerList').innerHTML = dl.map(([k, t]) => `<option value="${esc(t)}"></option>`).join('');
  const di = $('#fDealer'); if (document.activeElement !== di) di.value = S.f.dealer ? fText('dealer') : ''; di.classList.toggle('hv', !!S.f.dealer);
  di.disabled = !dl.length && !S.f.dealer; di.placeholder = dl.length || S.f.dealer ? 'ค้นหา Dealer...' : 'ไม่มีข้อมูลรายร้านในเดือนนี้';
  fill('fShow', 'show', 'ทุก Showroom', opts('show', '', r => r.show, r => r.showName + (S.f.dealer ? '' : ' · ' + r.dealerName)));
  document.querySelectorAll('#line button').forEach(b => b.classList.toggle('on', b.dataset.v === S.line));
  document.querySelectorAll('#maker button').forEach(b => b.classList.toggle('on', b.dataset.v === S.f.maker));
  const on = Object.keys(F0).filter(k => S.f[k]);
  $('#fdot').classList.toggle('on', on.length > 0 || S.line !== 'ALL');
  const st = $('#fstatus');
  st.hidden = !on.length;
  st.innerHTML = 'กรองอยู่: ' + on.map(k => `<span class="fchip">${FL[k]}: ${esc(fText(k))}<button data-clr="${k}" aria-label="ล้าง ${FL[k]}">✕</button></span>`).join('');
}
let PREV = '';
function render() {
  PREV = S.m > 0 ? mLabel(DATA.months[S.m - 1].month) : '';
  const V = view(S.m), P = S.m > 0 ? view(S.m - 1) : null;
  syncFilters();
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === S.tab));
  if (!V) { $('#app').innerHTML = '<div class="empty">ยังไม่มีข้อมูล — อัปโหลด Collection Report ลงโฟลเดอร์ Drive</div>'; return; }
  const amsHere = [...new Set(flat(S.m).map(r => r.am))].sort();
  $('#sub').textContent = `${S.f.am || amsHere.join(' + ')} · ข้อมูล ณ ${V.M.asOf.split('-').reverse().join('/')} · ${S.line === 'ALL' ? 'MO + EA' : S.line}`;
  $('#app').innerHTML = ({ov, nod, staff, dlr, one})[S.tab](V, P);
  $('#foot').innerHTML = `ไฟล์ต้นทาง: ${esc(V.M.source)} · สร้างเมื่อ ${esc(V.M.builtAt)} · %OD = (OD1+OD2+OD3+NPL) ÷ Active (ไม่รวม Closed) · ไม่มีข้อมูลลูกค้าในหน้านี้`;
}
document.addEventListener('click', e => {
  const th = e.target.closest('th[data-tb]');
  if (th) { const id = th.dataset.tb, k = th.dataset.k, cur = S.sort[id]; S.sort[id] = {k, asc: cur && cur.k === k ? !cur.asc : false}; render(); return; }
  const tr = e.target.closest('tr[data-emp]');
  if (tr) { S.emp = tr.dataset.emp; S.tab = 'one'; ss('tab', 'one'); render(); scrollTo(0, 0); return; }
  const lb = e.target.closest('#line button'); if (lb) { S.line = lb.dataset.v; ss('line', S.line); render(); return; }
  const mb = e.target.closest('#maker button'); if (mb) { S.f.maker = mb.dataset.v; render(); return; }
  const cl = e.target.closest('[data-clr]'); if (cl) { S.f[cl.dataset.clr] = ''; if (cl.dataset.clr === 'dealer') S.f.show = ''; render(); return; }
  const dk = e.target.closest('[data-dealer]'); if (dk) { e.preventDefault(); S.f.dealer = dk.dataset.dealer; S.f.show = ''; S.q = ''; render(); return; }
  if (e.target.closest('#freset')) { S.f = {...F0}; S.line = 'ALL'; ss('line', 'ALL'); $('#fDealer').value = ''; render(); return; }
  const tg = e.target.closest('#ftog'); if (tg) { const p = $('#fpanel'), o = p.hidden; p.hidden = !o; tg.setAttribute('aria-expanded', String(o)); document.querySelector('header').classList.toggle('fopen', o); return; }
  const tb = e.target.closest('#tabs button'); if (tb) { S.tab = tb.dataset.t; S.q = ''; ss('tab', S.tab); render(); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'month') { S.m = +e.target.value; render(); }
  const FM = {fAm: 'am', fHub: 'hub', fTeam: 'team', fPos: 'pos', fEmp: 'emp', fShow: 'show'};
  if (FM[e.target.id]) { S.f[FM[e.target.id]] = e.target.value; render(); }
  if (e.target.id === 'fDealer') {
    const v = e.target.value.trim(), hit = opts('dealer', '', r => r.dealer, r => r.dealerName || r.dealer).find(([k, t]) => t === v || k === v);
    S.f.dealer = hit ? hit[0] : ''; S.f.show = ''; if (!hit) e.target.value = ''; render();
  }
  if (e.target.id === 'emp') { S.emp = e.target.value; render(); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'fQ') { S.q = e.target.value; const pos = e.target.selectionStart; render(); const i = $('#fQ'); i.focus(); i.setSelectionRange(pos, pos); }
});
$('#month').innerHTML = DATA.months.map((m, i) => `<option value="${i}">${mLabel(m.month)}</option>`).join('');
$('#month').value = S.m;
if (window.__VO_BACK__) { const b = document.createElement('a'); b.href = window.__VO_BACK__; b.textContent = '← ล็อบบี้'; b.style.cssText = 'flex-shrink:0;background:#9F1C33;color:#fff;padding:6px 12px;border-radius:999px;font-weight:600;font-size:13px;text-decoration:none'; $('.brand').prepend(b); }
S.line = sg('line') || 'ALL'; S.tab = sg('tab') || 'ov'; if (!document.querySelector(`#tabs [data-t="${S.tab}"]`)) S.tab = 'ov';
if (!$('#logo').getAttribute('src').startsWith('data:')) $('#logo').remove();
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(render,200)});
render();
})();
</script>
</body>
