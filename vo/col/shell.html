<style>
:root{--bg:#eef1f6;--card:#fff;--ink:#14213d;--muted:#6b7488;--line:#e6e9f0;--navy:#1e3763;--red:#a01c34;--chip:#e9eef8;
--ok:#0b6b3a;--od1:#e3a33b;--od2:#e07b39;--od3:#d1495b;--npl:#8e1b2b;--cur:#5b8bd6;--closed:#b8bfcc;--good:#0b6b3a;--bad:#a01c34;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1420;--card:#172033;--ink:#e6ebf5;--muted:#97a1b6;--line:#263149;--navy:#8fb0e8;--chip:#22304d;--cur:#6f9be0;--closed:#4b556b;--npl:#d0566a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1420;--card:#172033;--ink:#e6ebf5;--muted:#97a1b6;--line:#263149;--navy:#8fb0e8;--chip:#22304d;--cur:#6f9be0;--closed:#4b556b;--npl:#d0566a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Thai',-apple-system,'Segoe UI',sans-serif;font-size:14px;line-height:1.45}
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header.fopen{position:relative}
.hbar{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand img{height:30px}
.brand b{font-size:16px;color:var(--navy);white-space:nowrap}
.brand span{color:var(--muted);font-size:12px;display:block}
select,input{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 10px;min-height:36px}
.seg{display:inline-flex;background:var(--chip);border-radius:10px;padding:3px}
.seg button{font:inherit;border:0;background:transparent;color:var(--muted);padding:5px 12px;border-radius:8px;cursor:pointer;font-weight:500}
.seg button.on{background:var(--card);color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.12)}
nav{max-width:1180px;margin:0 auto;padding:0 16px;display:flex;gap:4px;overflow-x:auto}
nav button{font:inherit;border:0;background:none;color:var(--muted);padding:10px 12px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;font-weight:500}
nav button.on{color:var(--red);border-color:var(--red)}
main{max-width:1180px;margin:0 auto;padding:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.k{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.k .l{color:var(--muted);font-size:12px}
.k .v{font-size:22px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.k .d{font-size:12px;margin-top:2px;color:var(--muted)}
.up{color:var(--bad)}.down{color:var(--good)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:15px;color:var(--navy)}
.card h3 small{color:var(--muted);font-weight:400;font-size:12px;margin-left:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
@media (max-width:820px){.grid2{grid-template-columns:1fr}}
.stack{display:flex;height:22px;border-radius:8px;overflow:hidden;background:var(--chip)}
.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:12px;color:var(--muted)}
.legend span::before{content:'';display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--c);margin-right:5px;vertical-align:-1px}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:13px}
th,td{padding:7px 9px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:500;font-size:12px;cursor:pointer;user-select:none;background:var(--card);position:sticky;top:0}
th.s::after{content:' ▾'}th.s.asc::after{content:' ▴'}
td:first-child,th:first-child{text-align:left;position:sticky;left:0;background:var(--card);z-index:1}
td.t{text-align:left}
tr.tot td{font-weight:700;border-top:2px solid var(--line)}
tbody tr:hover td{background:var(--chip)}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:600}
.hi{background:rgba(200,16,46,.12);color:var(--bad)}.mid{background:rgba(227,163,59,.18);color:#a26a10}.lo{background:rgba(31,157,85,.12);color:var(--good)}
.bars .r{display:grid;grid-template-columns:minmax(70px,130px) 1fr 54px;gap:8px;align-items:center;margin:5px 0;font-size:12.5px}
.bars .r .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bars .r .b{height:14px;background:var(--chip);border-radius:6px;overflow:hidden}
.bars .r .b i{display:block;height:100%;background:var(--red);border-radius:6px}
.bars .r .x{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.filters input{flex:1;min-width:160px}
.muted{color:var(--muted)}
.sm{font-size:11.5px;color:var(--muted);font-weight:400;max-width:190px;overflow:hidden;text-overflow:ellipsis}
.empty{padding:40px;text-align:center;color:var(--muted)}
svg text{fill:var(--muted);font-size:11px;font-family:inherit}
.note{font-size:12px;color:var(--muted);margin-top:6px}
.who{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.who select{flex:1;min-width:220px}
.cmp .g{margin-bottom:12px}.cmp .h{font-weight:600;font-size:13px;margin-bottom:4px}
.cmp .r{display:grid;grid-template-columns:96px 1fr 62px;gap:8px;align-items:center;margin:4px 0;font-size:12.5px}
.cmp .r .n{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmp .b{height:14px;background:var(--chip);border-radius:6px;overflow:hidden}.cmp .b i{display:block;height:100%;border-radius:6px}
.cmp .x{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
footer{max-width:1180px;margin:0 auto;padding:4px 16px 30px;color:var(--muted);font-size:12px}
.ftog{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--chip);color:var(--navy);border-radius:10px;padding:7px 12px;cursor:pointer;position:relative;min-height:36px}
.ftog .arw{font-size:10px;display:inline-block;transition:transform .2s}.ftog[aria-expanded="true"] .arw{transform:rotate(180deg)}
.fdot{position:absolute;top:-3px;right:-3px;width:10px;height:10px;border-radius:50%;background:var(--red);border:2px solid var(--card);display:none}.fdot.on{display:block}
.fpanel{max-width:1180px;margin:0 auto;padding:4px 16px 12px}
.fsec{margin-top:10px}.fl{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
.ftgs{display:flex;flex-wrap:wrap;gap:10px 22px}.ftg .fl{margin-bottom:4px}
.fgrid{display:grid;gap:8px}.fgrid.c5{grid-template-columns:repeat(5,minmax(0,1fr))}.fgrid.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:820px){.fgrid.c5{grid-template-columns:repeat(2,minmax(0,1fr))}.fgrid.c2{grid-template-columns:1fr}}
.fgrid select,.fgrid input{width:100%;min-width:0}
.fgrid .hv{background:#fef9c3;color:#14213d;border-color:#e8d97a}
.ffoot{display:flex;justify-content:flex-end}.freset{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:7px 14px;cursor:pointer}
.fstatus[hidden]{display:none}
.fstatus{max-width:1180px;margin:0 auto;padding:6px 16px 8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.fchip{display:inline-flex;align-items:center;gap:6px;background:#fef9c3;color:#14213d;border:1px solid #e8d97a;border-radius:99px;padding:2px 4px 2px 10px;font-weight:500}
.fchip button{font:inherit;border:0;background:rgba(0,0,0,.08);border-radius:99px;width:20px;height:20px;cursor:pointer;line-height:1}
</style>
</head>
<body>

(() => { if (!window.__VO_COL__) { document.body.innerHTML = '<p style="padding:40px;text-align:center">กรุณาเปิดผ่าน SCAP ออฟฟิศ</p>'; return; }  // ทุกอย่างอยู่ในฟังก์ชัน — เปิดผ่านออฟฟิศ (document.write) แล้วชื่อตัวแปรไม่ชนกับหน้าออฟฟิศ
const DATA = window.__VO_COL__ || null;
const ST = ['Current','OD1','OD2','OD3','NPL','Closed'];
const COL = {Current:'var(--cur)',OD1:'var(--od1)',OD2:'var(--od2)',OD3:'var(--od3)',NPL:'var(--npl)',Closed:'var(--closed)'};
const HUBS = window.__VO_HUBS__ || {"teamHub":{"E1101":"H11","E1301":"H11","E1401":"H11","E1501":"H11","I1101":"H12","I2101":"H12","I3101":"H12","I3201":"H12","I1201":"H13","I2201":"H13","I2301":"H13","N1101":"H14","N1301":"H14","N1201":"H14","N2401":"H21","N2201":"H21","N2301":"H21","C1101":"H22","C1201":"H22","C1301":"H22","C1302":"H22","C1401":"H23","C1402":"H23","C1403":"H23","N2101":"H23","S1101":"H31","S11012":"H31","S1201":"H31","S1202":"H31","S1301":"H31","S2101":"H32","S2201":"H32","S2301":"H32","S2401":"H32","B1101":"H41","B1201":"H41","B1601":"H41","B1701":"H41","B1301":"H42","B1401":"H42","B1501":"H42","B1801":"H42"},"hubInfo":{"H11":{"am":"AM1","rm":"จุรินทร เยาว์มณี","nick":"แอม"},"H12":{"am":"AM1","rm":"ชุติมา แซ่จึง","nick":"หมวย"},"H13":{"am":"AM1","rm":"ธเนษฐ วะน้ำค้าง","nick":"หนึ่ง"},"H14":{"am":"AM1","rm":"พิมพ์รัตน์ หลวงอ้าย","nick":"ต่าย"},"H21":{"am":"AM2","rm":"กรวีร์ อินทโร","nick":"นุ๊ก"},"H22":{"am":"AM2","rm":"ธัญญ์พิศา กิจเจริญวสุ","nick":"แก้ว"},"H23":{"am":"AM2","rm":"ดวงพร รัตนธรรม","nick":"ต้อย"},"H31":{"am":"AM3","rm":"เบญญพนต์ คีรีรัตน์","nick":"ออฟ"},"H32":{"am":"AM3","rm":"เพชรดารา เลี่ยนกัตวา","nick":"บี"},"H41":{"am":"AM4","rm":"ยุวดี บัณฑิชาติ","nick":"หนามเตย"},"H42":{"am":"AM4","rm":"ธีระยุทธ พิมพาภรณ์","nick":"ต้นหลิว"}},"amName":{"AM1":"ศรีสุดา ศรีพิบูลย์ (หมวย)","AM2":"อภิสิทธิ์ พละศักดิ์ (ปุ้ย)","AM3":"จารนัย ไทยเจริญ (เพียว)","AM4":"รักษ์พล นุชนนท์ (โต้ง)"}};   // {teamHub:{C1101:'H22'}, hubInfo:{H22:{am,rm,nick}}, amName:{AM2:'...'}}
const F0 = {maker: '', am: '', hub: '', team: '', pos: '', emp: '', dealer: '', show: ''};
const S = {m: DATA.months.length - 1, line: 'ALL', tab: 'ov', sort: {}, f: {...F0}, q: '', emp: ''};
const POS_EMP = new Set(['CK', 'Sr.CK', 'BK', 'AG']);
const $ = s => document.querySelector(s);
const fmt = n => (n || 0).toLocaleString('th-TH');
const pct = (a, b) => b ? a / b * 100 : 0;
const p1 = v => v.toFixed(2) + '%';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const baht = n => n >= 1e6 ? (n / 1e6).toFixed(2) + ' ล้าน' : fmt(Math.round(n));
const ss = (k, v) => { try { sessionStorage.setItem('col_' + k, v) } catch (_) {} };
const sg = k => { try { return sessionStorage.getItem('col_' + k) } catch (_) { return null } };

function add(a, b) { for (const k of [...ST, 'new', 'cured', 'odAmt', 'paid', 'remain']) a[k] = (a[k] || 0) + (b[k] || 0); return a; }
function calc(r) { r.active = ST.slice(0, 5).reduce((s, k) => s + (r[k] || 0), 0); r.od = r.OD1 + r.OD2 + r.OD3 + r.NPL; r.pod = pct(r.od, r.active); r.pnew = pct(r.new, r.active); return r; }
const NUMS = [...ST, 'new', 'cured', 'odAmt', 'paid', 'remain'];
const hubOf = team => (HUBS.teamHub || {})[team] || '';
const hubLabel = h => { const i = (HUBS.hubInfo || {})[h]; return i ? `${h} · ${i.rm}${i.nick ? ' (' + i.nick + ')' : ''}` : h; };
const amLabel = a => (HUBS.amName || {})[a] ? `${a} · ${HUBS.amName[a]}` : a;
// แตกข้อมูลแต่ละเดือนเป็นแถว (ทีม × พนักงาน × Showroom) ครั้งเดียว แล้วใช้กรอง/รวมทุกหน้า
const CACHE = {};
function flat(mi) {
  if (CACHE[mi]) return CACHE[mi];
  const M = DATA.months[mi], out = [];
  for (const l of ['MO', 'EA']) {
    const L = M.lines[l]; if (!L) continue;
    const tm = {}, em = {}; L.teams.forEach(t => tm[t.team] = t); L.staff.forEach(p => em[p.team + '|' + p.emp] = p);
    const shows = L.shows || {};
    const src = L.rows && L.rows.length ? L.rows.map(r => { const o = {team: r[0], emp: r[1], show: r[2]}; NUMS.forEach((k, i) => o[k] = r[3 + i]); return o; })
      : L.staff.map(p => Object.assign({show: ''}, p));   // ข้อมูลรุ่นเก่า (ไม่มีรายร้าน)
    for (const r of src) {
      const t = tm[r.team] || {}, p = em[r.team + '|' + r.emp] || {}, sh = shows[r.show] || [];
      out.push(Object.assign(r, {line: l, am: t.am || 'AM2', hub: hubOf(r.team), teamName: t.teamName || '', tmName: t.tm || '',
        name: p.name || r.emp, nick: p.nick || '', pos: p.pos || '', showName: sh[0] || '', dealer: sh[1] || '', dealerName: sh[2] || ''}));
    }
  }
  return CACHE[mi] = out;
}
const maker = r => r.pos === 'DL' ? 'dlr' : POS_EMP.has(r.pos) ? 'emp' : 'oth';
// ผ่านตัวกรองทั้งหมด ยกเว้นตัวที่ระบุ (ใช้สร้างตัวเลือกแบบต่อเนื่อง เหมือน Dashboard Daily)
function pass(r, skip) {
  const f = S.f;
  return (S.line === 'ALL' || r.line === S.line) &&
    (skip === 'maker' || !f.maker || maker(r) === f.maker) && (skip === 'am' || !f.am || r.am === f.am) &&
    (skip === 'hub' || !f.hub || r.hub === f.hub) && (skip === 'team' || !f.team || r.team === f.team) &&
    (skip === 'pos' || !f.pos || r.pos === f.pos) && (skip === 'emp' || !f.emp || r.team + '|' + r.emp === f.emp) &&
    (skip === 'dealer' || !f.dealer || r.dealer === f.dealer) && (skip === 'show' || !f.show || r.show === f.show);
}
function view(mi) {
  const M = DATA.months[mi]; if (!M) return null;
  const R = flat(mi).filter(r => pass(r));
  const teams = {}, staff = {}, dealers = {}, tot = {};
  for (const r of R) {
    add(teams[r.team] ||= {team: r.team, teamName: r.teamName, tm: r.tmName, am: r.am, hub: r.hub}, r);
    const k = r.team + '|' + r.emp;
    add(staff[k] ||= {key: k, team: r.team, emp: r.emp, name: r.name, nick: r.nick, pos: r.pos}, r);
    if (r.dealer) { const d = dealers[r.dealer] ||= {dealer: r.dealer, dealerName: r.dealerName, shows: new Set(), teams: new Set()}; add(d, r); d.shows.add(r.show); d.teams.add(r.team); }
    add(tot, r);
  }
  const T = Object.values(teams).map(calc).sort((a, b) => a.team.localeCompare(b.team));
  const P = Object.values(staff).map(calc);
  const D = Object.values(dealers).map(d => calc(Object.assign(d, {nShow: d.shows.size, teamList: [...d.teams].sort().join(', ')})));
  return {M, T, P, D, tot: calc(tot), hasShop: flat(mi).some(r => r.dealer)};
}
function cls(v) { return v >= 5 ? 'hi' : v >= 2.5 ? 'mid' : 'lo'; }
function delta(cur, prev, unit, invert) {
  if (prev == null) return '<span class="muted">ยังไม่มีเดือนให้เทียบ</span>';
  const d = cur - prev; if (Math.abs(d) < 1e-9) return 'เท่ากับ ' + PREV;
  const bad = invert ? d < 0 : d > 0;
  return `<span class="${bad ? 'up' : 'down'}">${d > 0 ? '▲' : '▼'} ${unit === '%' ? Math.abs(d).toFixed(2) + ' จุด' : fmt(Math.abs(Math.round(d)))}</span> จาก ${PREV}`;
}
function sortTable(id, rows, def) {
  const s = S.sort[id] || def; const dir = s.asc ? 1 : -1;
  return rows.slice().sort((a, b) => { const x = a[s.k], y = b[s.k]; return (typeof x === 'string' ? x.localeCompare(y) : (x - y)) * dir; });
}
function table(id, cols, rows, def, total) {
  const s = S.sort[id] || def;
  const h = cols.map(c => `<th data-tb="${id}" data-k="${c.k}" class="${c.k === s.k ? 's' + (s.asc ? ' asc' : '') : ''}" ${c.t ? 'style="text-align:left"' : ''}>${c.h}</th>`).join('');
  const body = sortTable(id, rows, def).map(r => `<tr ${r.key ? `data-emp="${esc(r.key)}" style="cursor:pointer"` : ''}>${cols.map(c => `<td class="${c.t ? 't' : ''}">${c.f ? c.f(r) : esc(r[c.k])}</td>`).join('')}</tr>`).join('');
  const ft = total ? `<tr class="tot">${cols.map((c, i) => `<td class="${c.t ? 't' : ''}">${i === 0 ? 'รวม' : c.tot ? c.f(total) : ''}</td>`).join('')}</tr>` : '';
  return `<div class="tw"><table><thead><tr>${h}</tr></thead><tbody>${body}${ft}</tbody></table></div>`;
}
function stackBar(r) {
  const tot = ST.reduce((s, k) => s + (r[k] || 0), 0) || 1;
  return `<div class="stack">${ST.map(k => `<i style="width:${(r[k] || 0) / tot * 100}%;background:${COL[k]}" title="${k} ${fmt(r[k])}"></i>`).join('')}</div>
  <div class="legend">${ST.map(k => `<span style="--c:${COL[k]}">${k} ${fmt(r[k])} (${pct(r[k], tot).toFixed(1)}%)</span>`).join('')}</div>`;
}
function bars(items, val, label, fmtv) {
  const mx = Math.max(...items.map(val), 0) || 1;
  return `<div class="bars">${items.map(i => `<div class="r"><div class="n" title="${esc(label(i))}">${esc(label(i))}</div><div class="b"><i style="width:${val(i) / mx * 100}%"></i></div><div class="x">${fmtv(val(i))}</div></div>`).join('')}</div>`;
}
function trend(series) { // series: [{label, v1, v2}] v1 = %OD (line), v2 = New OD (bars)
  if (series.length < 2) return '<div class="note">กราฟแนวโน้มจะแสดงเมื่อมีข้อมูลตั้งแต่ 2 เดือนขึ้นไป — อัปโหลดไฟล์เดือนถัดไปแล้วกราฟจะขึ้นเอง</div>';
  const W = Math.max(320, Math.min(640, innerWidth - 70)), H = 190, pl = 30, pr = 30, pt = 22, pb = 24, n = series.length;
  const x = i => pl + (W - pl - pr) * (n === 1 ? .5 : i / (n - 1));
  const m1 = Math.max(...series.map(s => s.v1)) * 1.15 || 1, m2 = Math.max(...series.map(s => s.v2)) * 1.6 || 1;
  const y1 = v => H - pb - (H - pt - pb) * v / m1, y2 = v => H - pb - (H - pt - pb) * v / m2;
  const bw = Math.min(34, (W - pl - pr) / n * .5);
  const barsS = series.map((s, i) => `<rect x="${x(i) - bw / 2}" y="${y2(s.v2)}" width="${bw}" height="${H - pb - y2(s.v2)}" rx="4" fill="var(--chip)"><title>New OD ${fmt(s.v2)}</title></rect><text x="${x(i)}" y="${H - pb - 5}" text-anchor="middle" style="font-weight:600">${fmt(s.v2)}</text>`).join('');
  const path = series.map((s, i) => (i ? 'L' : 'M') + x(i) + ' ' + y1(s.v1)).join(' ');
  const dots = series.map((s, i) => `<circle cx="${x(i)}" cy="${y1(s.v1)}" r="4" fill="var(--red)"><title>%OD ${p1(s.v1)}</title></circle><text x="${x(i)}" y="${y1(s.v1) - 9}" text-anchor="middle" style="fill:var(--red);font-weight:600">${s.v1.toFixed(2)}%</text>`).join('');
  const xl = series.map((s, i) => `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${s.label}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="แนวโน้ม %OD และ New OD">${barsS}<path d="${path}" fill="none" stroke="var(--red)" stroke-width="2.5"/>${dots}${xl}</svg>
  <div class="legend"><span style="--c:var(--red)">%OD (เส้น)</span><span style="--c:var(--chip)">New OD (แท่ง)</span></div>`;
}
const TH_M = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const mLabel = m => { const [y, mo] = m.split('-').map(Number); return TH_M[mo - 1] + ' ' + String((y + 543) % 100).padStart(2, '0'); };

function ov(V, P) {
  const t = V.tot, pt = P && P.tot;
  const tr = DATA.months.map((m, i) => { const v = view(i); return {label: mLabel(m.month), v1: v.tot.pod, v2: v.tot.new}; });
  const tcols = [
    {k: 'team', h: 'ทีม', t: 1, f: r => `<b>${esc(r.team)}</b>${r.teamName ? `<div class="sm">${esc(r.teamName)}</div>` : ''}`},
    {k: 'pod', h: '%OD', f: r => `<span class="pill ${cls(r.pod)}">${p1(r.pod)}</span>`, tot: 1},
    {k: 'new', h: 'New OD', f: r => fmt(r.new), tot: 1}, {k: 'active', h: 'Active', f: r => fmt(r.active), tot: 1},
    {k: 'OD1', h: 'OD1', f: r => fmt(r.OD1), tot: 1}, {k: 'OD2', h: 'OD2', f: r => fmt(r.OD2), tot: 1},
    {k: 'OD3', h: 'OD3', f: r => fmt(r.OD3), tot: 1}, {k: 'NPL', h: 'NPL', f: r => fmt(r.NPL), tot: 1},
    {k: 'odAmt', h: 'ยอดค้าง OD (บาท)', f: r => fmt(r.odAmt), tot: 1},
    {k: 'paid', h: 'รับชำระเดือนนี้', f: r => fmt(r.paid), tot: 1}];
  return `<div class="kpis">
    <div class="k"><div class="l">บัญชี Active</div><div class="v">${fmt(t.active)}</div><div class="d">${pt ? delta(t.active, pt.active, '', true) : ''}</div></div>
    <div class="k"><div class="l">บัญชี OD (OD1–NPL)</div><div class="v">${fmt(t.od)}</div><div class="d">${delta(t.od, pt && pt.od)}</div></div>
    <div class="k"><div class="l">%OD</div><div class="v" style="color:var(--red)">${p1(t.pod)}</div><div class="d">${delta(t.pod, pt && pt.pod, '%')}</div></div>
    <div class="k"><div class="l">New OD</div><div class="v">${fmt(t.new)}</div><div class="d">${delta(t.new, pt && pt.new)}</div></div>
    <div class="k"><div class="l">ยอดค้าง OD</div><div class="v">${baht(t.odAmt)}</div><div class="d">บาท</div></div>
    <div class="k"><div class="l">รับชำระเดือนนี้</div><div class="v">${baht(t.paid)}</div><div class="d">บาท</div></div>
  </div>
  <div class="grid2">
    <div class="card"><h3>สถานะบัญชีทั้งหมด<small>รวม Closed</small></h3>${stackBar(t)}</div>
    <div class="card"><h3>แนวโน้มรายเดือน</h3>${trend(tr)}</div>
  </div>
  <div class="card"><h3>เทียบรายทีม<small>แตะหัวตารางเพื่อเรียง</small></h3>${table('team', tcols, V.T, {k: 'pod'}, t)}</div>`;
}
function nod(V) {
  const T = V.T.slice().sort((a, b) => b.new - a.new);
  const top = V.P.filter(p => p.new > 0).sort((a, b) => b.new - a.new || b.pnew - a.pnew).slice(0, 15);
  const cols = [
    {k: 'name', h: 'พนักงาน', t: 1, f: r => `<b>${esc(r.name)}</b>${r.nick ? ` <span class="muted">(${esc(r.nick)})</span>` : ''}<div class="sm">${esc(r.team)} · ${esc(r.pos)}</div>`},
    {k: 'new', h: 'New OD', f: r => fmt(r.new)}, {k: 'active', h: 'Active', f: r => fmt(r.active)},
    {k: 'pnew', h: 'New OD ÷ Active', f: r => p1(r.pnew)}, {k: 'od', h: 'OD รวม', f: r => fmt(r.od)}];
  return `<div class="kpis">
    <div class="k"><div class="l">New OD ทั้งหมด</div><div class="v" style="color:var(--red)">${fmt(V.tot.new)}</div><div class="d">${p1(V.tot.pnew)} ของ Active</div></div>
    <div class="k"><div class="l">พนักงานที่มี New OD</div><div class="v">${fmt(V.P.filter(p => p.new > 0).length)}</div><div class="d">จาก ${fmt(V.P.length)} คน</div></div>
    <div class="k"><div class="l">หลุดจาก OD กลับมาปกติ</div><div class="v" style="color:var(--good)">${fmt(V.tot.cured)}</div><div class="d">เดือนก่อนเป็น OD → เดือนนี้ Current/ปิด</div></div>
  </div>
  <div class="grid2">
    <div class="card"><h3>New OD รายทีม</h3>${bars(T, r => r.new, r => r.team + ' ' + (r.teamName || ''), fmt)}</div>
    <div class="card"><h3>New OD สูงสุด 15 คน</h3>${top.length ? bars(top, r => r.new, r => r.name + ' · ' + r.team, fmt) : '<div class="empty">ไม่มี New OD</div>'}</div>
  </div>
  <div class="card"><h3>รายชื่อพนักงานที่มี New OD</h3>${table('nod', cols, V.P.filter(p => p.new > 0), {k: 'new'})}</div>`;
}
function staff(V) {
  const q = S.q.trim().toLowerCase();
  const rows = V.P.filter(p => !q || (p.name + ' ' + p.nick + ' ' + p.emp).toLowerCase().includes(q));
  const cols = [
    {k: 'name', h: 'พนักงาน', t: 1, f: r => `<b>${esc(r.name)}</b>${r.nick ? ` <span class="muted">(${esc(r.nick)})</span>` : ''}<div class="sm">${esc(r.team)} · ${esc(r.pos)}</div>`},
    {k: 'pod', h: '%OD', f: r => `<span class="pill ${cls(r.pod)}">${p1(r.pod)}</span>`, tot: 1},
    {k: 'od', h: 'OD', f: r => fmt(r.od), tot: 1}, {k: 'new', h: 'New OD', f: r => fmt(r.new), tot: 1},
    {k: 'active', h: 'Active', f: r => fmt(r.active), tot: 1}, {k: 'NPL', h: 'NPL', f: r => fmt(r.NPL), tot: 1},
    {k: 'odAmt', h: 'ยอดค้าง OD', f: r => fmt(r.odAmt), tot: 1}];
  const tot = calc(rows.reduce((a, r) => add(a, r), {}));
  return `<div class="card"><h3>ผลงานรายคน<small>${fmt(rows.length)} คน · แตะชื่อเพื่อดูรายบุคคล · กรองทีม/ตำแหน่งได้ที่ปุ่ม "ตัวกรอง"</small></h3>
  <div class="filters"><input id="fQ" placeholder="ค้นหาชื่อ ชื่อเล่น หรือรหัส" value="${esc(S.q)}"></div>
  ${rows.length ? table('staff', cols, rows, {k: 'od'}, tot) : '<div class="empty">ไม่พบพนักงานตามที่เลือก</div>'}</div>`;
}
function dlr(V) {
  if (!V.hasShop) return '<div class="empty">ข้อมูลเดือนนี้ไม่มีรายร้าน — อัปโหลดไฟล์ของเดือนนี้ใหม่อีกครั้งเพื่อดูราย Dealer</div>';
  const q = S.q.trim().toLowerCase();
  const rows = V.D.filter(d => !q || (d.dealerName + ' ' + d.dealer).toLowerCase().includes(q));
  const top = V.D.filter(d => d.od > 0).sort((a, b) => b.od - a.od).slice(0, 10);
  const cols = [
    {k: 'dealerName', h: 'Dealer', t: 1, f: r => `<a href="#" data-dealer="${esc(r.dealer)}" style="color:inherit"><b>${esc(r.dealerName || r.dealer)}</b></a><div class="sm">${fmt(r.nShow)} showroom · ทีม ${esc(r.teamList)}</div>`},
    {k: 'pod', h: '%OD', f: r => `<span class="pill ${cls(r.pod)}">${p1(r.pod)}</span>`, tot: 1},
    {k: 'od', h: 'OD', f: r => fmt(r.od), tot: 1}, {k: 'new', h: 'New OD', f: r => fmt(r.new), tot: 1},
    {k: 'active', h: 'Active', f: r => fmt(r.active), tot: 1}, {k: 'NPL', h: 'NPL', f: r => fmt(r.NPL), tot: 1},
    {k: 'odAmt', h: 'ยอดค้าง OD', f: r => fmt(r.odAmt), tot: 1}];
  const tot = calc(rows.reduce((a, r) => add(a, r), {}));
  return `<div class="kpis">
    <div class="k"><div class="l">Dealer ที่มีบัญชี Active</div><div class="v">${fmt(V.D.filter(d => d.active).length)}</div><div class="d">นับรวมทุก showroom ของร้าน</div></div>
    <div class="k"><div class="l">Dealer ที่มี OD</div><div class="v" style="color:var(--red)">${fmt(V.D.filter(d => d.od).length)}</div><div class="d">มี New OD ${fmt(V.D.filter(d => d.new).length)} ร้าน</div></div>
  </div>
  <div class="card"><h3>Dealer ที่มี OD มากสุด 10 ร้าน</h3>${top.length ? bars(top, r => r.od, r => r.dealerName || r.dealer, fmt) : '<div class="empty">ไม่มี OD</div>'}</div>
  <div class="card"><h3>รายร้าน<small>${fmt(rows.length)} ร้าน · แตะชื่อร้านเพื่อกรองทั้งหน้าด้วยร้านนั้น</small></h3>
  <div class="filters"><input id="fQ" placeholder="ค้นหาชื่อร้านหรือรหัส" value="${esc(S.q)}"></div>
  ${rows.length ? table('dlr', cols, rows, {k: 'od'}, tot) : '<div class="empty">ไม่พบร้านตามที่เลือก</div>'}</div>`;
}
function one(V) {
  const list = V.P.slice().sort((a, b) => a.team.localeCompare(b.team) || a.name.localeCompare(b.name));
  if (!list.length) return '<div class="empty">ไม่มีข้อมูล</div>';
  if (!list.find(p => p.key === S.emp)) S.emp = list.slice().sort((a, b) => b.od - a.od)[0].key;
  const p = list.find(x => x.key === S.emp);
  const peers = V.P.filter(x => x.pos === p.pos && x.active > 0);
  const avg = calc(peers.reduce((a, r) => add(a, r), {}));
  const team = V.T.find(t => t.team === p.team) || avg;
  const hist = DATA.months.map((m, i) => { const v = view(i); const q = v.P.find(x => x.emp === p.emp); return q ? {label: mLabel(m.month), v1: q.pod, v2: q.new} : null; }).filter(Boolean);
  const cmp = (lab, a, b, c) => { const mx = Math.max(a, b, c, .01) * 1.1;
    const row = (n, v, col) => `<div class="r"><div class="n">${n}</div><div class="b"><i style="width:${v / mx * 100}%;background:${col}"></i></div><div class="x">${p1(v)}</div></div>`;
    return `<div class="g"><div class="h">${lab}</div>${row('คนนี้', a, 'var(--red)')}${row('เฉลี่ย ' + esc(p.pos), b, 'var(--navy)')}${row('ทีม ' + esc(p.team), c, 'var(--closed)')}</div>`; };
  return `<div class="who"><select id="emp">${list.map(x => `<option value="${esc(x.key)}" ${x.key === S.emp ? 'selected' : ''}>${esc(x.team)} · ${esc(x.name)}${x.nick ? ' (' + esc(x.nick) + ')' : ''} · ${esc(x.pos)}</option>`).join('')}</select></div>
  <div class="kpis">
    <div class="k"><div class="l">Active</div><div class="v">${fmt(p.active)}</div><div class="d">${esc(p.pos)} · ทีม ${esc(p.team)}</div></div>
    <div class="k"><div class="l">OD</div><div class="v">${fmt(p.od)}</div><div class="d">NPL ${fmt(p.NPL)}</div></div>
    <div class="k"><div class="l">%OD</div><div class="v" style="color:var(--red)">${p1(p.pod)}</div><div class="d">เฉลี่ย ${esc(p.pos)} ${p1(avg.pod)}</div></div>
    <div class="k"><div class="l">New OD</div><div class="v">${fmt(p.new)}</div><div class="d">${p1(p.pnew)} ของ Active</div></div>
    <div class="k"><div class="l">ยอดค้าง OD</div><div class="v">${baht(p.odAmt)}</div><div class="d">บาท</div></div>
  </div>
  <div class="grid2">
    <div class="card"><h3>สถานะบัญชี</h3>${stackBar(p)}</div>
    <div class="card cmp"><h3>เทียบกับคนตำแหน่งเดียวกัน<small>${fmt(peers.length)} คนในข้อมูลที่คุณเห็น</small></h3>${cmp('%OD', p.pod, avg.pod, team.pod)}${cmp('New OD ÷ Active', p.pnew, avg.pnew, team.pnew)}</div>
  </div>
  <div class="card"><h3>แนวโน้มของคนนี้</h3>${trend(hist)}</div>`;
}

const FL = {maker: 'ผู้ทำเคส', am: 'AM', hub: 'Hub RM', team: 'ทีม', pos: 'ตำแหน่ง', emp: 'พนักงาน', dealer: 'Dealer', show: 'Showroom'};
function opts(key, label, val, text) {   // ตัวเลือกจากข้อมูลที่ผ่านตัวกรองอื่นทั้งหมด
  const m = new Map();
  for (const r of flat(S.m)) if (pass(r, key)) { const v = val(r); if (v && !m.has(v)) m.set(v, text(r)); }
  if (S.f[key] && !m.has(S.f[key])) S.f[key] = '';   // ค่าที่เลือกไว้ไม่มีในเดือน/ขอบเขตนี้แล้ว
  return [...m].sort((a, b) => a[1].localeCompare(b[1], 'th'));
}
function fill(id, key, all, list) {
  const el = $('#' + id); const v = S.f[key];
  el.innerHTML = `<option value="">${all}</option>` + list.map(([k, t]) => `<option value="${esc(k)}" ${k === v ? 'selected' : ''}>${esc(t)}</option>`).join('');
  el.classList.toggle('hv', !!v);
}
function fText(k) {
  const f = S.f[k], r = flat(S.m).find(x => (k === 'emp' ? x.team + '|' + x.emp : x[k]) === f) || {};
  return k === 'maker' ? (f === 'emp' ? 'พนักงาน CK/BK/AG' : 'ร้านทำเคส') : k === 'am' ? amLabel(f) : k === 'hub' ? hubLabel(f)
    : k === 'team' ? f + (r.teamName ? ' ' + r.teamName : '') : k === 'emp' ? (r.name || f) : k === 'dealer' ? (r.dealerName || f) : k === 'show' ? (r.showName || f) : f;
}
const fval = (k, r) => k === 'maker' ? maker(r) : k === 'emp' ? r.team + '|' + r.emp : r[k];
function syncFilters() {
  // ตัวกรองที่ไม่มีข้อมูลในเดือน/ขอบเขตนี้ → ล้างทีละตัว เริ่มจากตัวที่ละเอียดที่สุด (Showroom → Dealer → ... → AM)
  for (const k of ['show', 'dealer', 'emp', 'pos', 'team', 'hub', 'am', 'maker'])
    if (S.f[k] && !flat(S.m).some(r => pass(r, k) && fval(k, r) === S.f[k])) S.f[k] = '';
  fill('fAm', 'am', 'AM ทั้งหมด', opts('am', '', r => r.am, r => amLabel(r.am)));
  fill('fHub', 'hub', 'Hub RM ทั้งหมด', opts('hub', '', r => r.hub, r => hubLabel(r.hub)));
  fill('fTeam', 'team', 'ทุกทีม', opts('team', '', r => r.team, r => r.team + (r.teamName ? ' ' + r.teamName : '')));
  fill('fPos', 'pos', 'ทุกตำแหน่ง', opts('pos', '', r => r.pos, r => r.pos));
  fill('fEmp', 'emp', 'ทุก CK/BK/AG', opts('emp', '', r => r.team + '|' + r.emp, r => r.name + (r.nick ? ' (' + r.nick + ')' : '') + ' · ' + r.team));
  const dl = opts('dealer', '', r => r.dealer, r => r.dealerName || r.dealer);
  $('#dealerList').innerHTML = dl.map(([k, t]) => `<option value="${esc(t)}"></option>`).join('');
  const di = $('#fDealer'); if (document.activeElement !== di) di.value = S.f.dealer ? fText('dealer') : ''; di.classList.toggle('hv', !!S.f.dealer);
  di.disabled = !dl.length && !S.f.dealer; di.placeholder = dl.length || S.f.dealer ? 'ค้นหา Dealer...' : 'ไม่มีข้อมูลรายร้านในเดือนนี้';
  fill('fShow', 'show', 'ทุก Showroom', opts('show', '', r => r.show, r => r.showName + (S.f.dealer ? '' : ' · ' + r.dealerName)));
  document.querySelectorAll('#line button').forEach(b => b.classList.toggle('on', b.dataset.v === S.line));
  document.querySelectorAll('#maker button').forEach(b => b.classList.toggle('on', b.dataset.v === S.f.maker));
  const on = Object.keys(F0).filter(k => S.f[k]);
  $('#fdot').classList.toggle('on', on.length > 0 || S.line !== 'ALL');
  const st = $('#fstatus');
  st.hidden = !on.length;
  st.innerHTML = 'กรองอยู่: ' + on.map(k => `<span class="fchip">${FL[k]}: ${esc(fText(k))}<button data-clr="${k}" aria-label="ล้าง ${FL[k]}">✕</button></span>`).join('');
}
let PREV = '';
function render() {
  PREV = S.m > 0 ? mLabel(DATA.months[S.m - 1].month) : '';
  const V = view(S.m), P = S.m > 0 ? view(S.m - 1) : null;
  syncFilters();
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === S.tab));
  if (!V) { $('#app').innerHTML = '<div class="empty">ยังไม่มีข้อมูล — อัปโหลด Collection Report ลงโฟลเดอร์ Drive</div>'; return; }
  const amsHere = [...new Set(flat(S.m).map(r => r.am))].sort();
  $('#sub').textContent = `${S.f.am || amsHere.join(' + ')} · ข้อมูล ณ ${V.M.asOf.split('-').reverse().join('/')} · ${S.line === 'ALL' ? 'MO + EA' : S.line}`;
  $('#app').innerHTML = ({ov, nod, staff, dlr, one})[S.tab](V, P);
  $('#foot').innerHTML = `ไฟล์ต้นทาง: ${esc(V.M.source)} · สร้างเมื่อ ${esc(V.M.builtAt)} · %OD = (OD1+OD2+OD3+NPL) ÷ Active (ไม่รวม Closed) · ไม่มีข้อมูลลูกค้าในหน้านี้`;
}
document.addEventListener('click', e => {
  const th = e.target.closest('th[data-tb]');
  if (th) { const id = th.dataset.tb, k = th.dataset.k, cur = S.sort[id]; S.sort[id] = {k, asc: cur && cur.k === k ? !cur.asc : false}; render(); return; }
  const tr = e.target.closest('tr[data-emp]');
  if (tr) { S.emp = tr.dataset.emp; S.tab = 'one'; ss('tab', 'one'); render(); scrollTo(0, 0); return; }
  const lb = e.target.closest('#line button'); if (lb) { S.line = lb.dataset.v; ss('line', S.line); render(); return; }
  const mb = e.target.closest('#maker button'); if (mb) { S.f.maker = mb.dataset.v; render(); return; }
  const cl = e.target.closest('[data-clr]'); if (cl) { S.f[cl.dataset.clr] = ''; if (cl.dataset.clr === 'dealer') S.f.show = ''; render(); return; }
  const dk = e.target.closest('[data-dealer]'); if (dk) { e.preventDefault(); S.f.dealer = dk.dataset.dealer; S.f.show = ''; S.q = ''; render(); return; }
  if (e.target.closest('#freset')) { S.f = {...F0}; S.line = 'ALL'; ss('line', 'ALL'); $('#fDealer').value = ''; render(); return; }
  const tg = e.target.closest('#ftog'); if (tg) { const p = $('#fpanel'), o = p.hidden; p.hidden = !o; tg.setAttribute('aria-expanded', String(o)); document.querySelector('header').classList.toggle('fopen', o); return; }
  const tb = e.target.closest('#tabs button'); if (tb) { S.tab = tb.dataset.t; S.q = ''; ss('tab', S.tab); render(); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'month') { S.m = +e.target.value; render(); }
  const FM = {fAm: 'am', fHub: 'hub', fTeam: 'team', fPos: 'pos', fEmp: 'emp', fShow: 'show'};
  if (FM[e.target.id]) { S.f[FM[e.target.id]] = e.target.value; render(); }
  if (e.target.id === 'fDealer') {
    const v = e.target.value.trim(), hit = opts('dealer', '', r => r.dealer, r => r.dealerName || r.dealer).find(([k, t]) => t === v || k === v);
    S.f.dealer = hit ? hit[0] : ''; S.f.show = ''; if (!hit) e.target.value = ''; render();
  }
  if (e.target.id === 'emp') { S.emp = e.target.value; render(); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'fQ') { S.q = e.target.value; const pos = e.target.selectionStart; render(); const i = $('#fQ'); i.focus(); i.setSelectionRange(pos, pos); }
});
$('#month').innerHTML = DATA.months.map((m, i) => `<option value="${i}">${mLabel(m.month)}</option>`).join('');
$('#month').value = S.m;
if (window.__VO_BACK__) { const b = document.createElement('a'); b.href = window.__VO_BACK__; b.textContent = '← ล็อบบี้'; b.style.cssText = 'flex-shrink:0;background:#A01C34;color:#fff;padding:6px 12px;border-radius:999px;font-weight:600;font-size:13px;text-decoration:none'; $('.brand').prepend(b); }
S.line = sg('line') || 'ALL'; S.tab = sg('tab') || 'ov'; if (!document.querySelector(`#tabs [data-t="${S.tab}"]`)) S.tab = 'ov';
if (!$('#logo').getAttribute('src').startsWith('data:')) $('#logo').remove();
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(render,200)});
render();
})();
</script>
</body>
</html>
