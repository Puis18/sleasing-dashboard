<html lang="th"><head><meta name="robots" content="noindex,nofollow"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard Daily v2</title>
<style>

:root{--bg:#eef1f6;--card:#fff;--ink:#14213d;--mut:#6b7488;--line:#e6e9f0;--navy:#1f3a68;--red:#c8102e;--green:#1f9d55;--amber:#e3a33b;--soft:#f5f7fb;--chip:#e9eef8;--hatch:#dfe5ef}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1420;--card:#172033;--ink:#e8ecf4;--mut:#9aa4b8;--line:#263248;--navy:#7aa5f2;--red:#ff5a6e;--green:#4ccf86;--amber:#f2c063;--soft:#121a2a;--chip:#22304d;--hatch:#2a3854}}
:root[data-theme=dark]{--bg:#0e1420;--card:#172033;--ink:#e8ecf4;--mut:#9aa4b8;--line:#263248;--navy:#7aa5f2;--red:#ff5a6e;--green:#4ccf86;--amber:#f2c063;--soft:#121a2a;--chip:#22304d;--hatch:#2a3854}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Thai',sans-serif;font-size:14px}
.wrap{max-width:1200px;margin:0 auto;padding:16px}
.frame{background:var(--soft);border-radius:24px;padding:18px;border:1px solid var(--line)}
nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.logo{margin-right:auto;background:#fff;border-radius:12px;padding:6px 10px;display:flex}.logo img{height:34px}
.tab{padding:7px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--mut);font-size:13px;cursor:pointer;font-family:inherit}
.tab.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.hello{display:flex;justify-content:space-between;align-items:end;margin:16px 2px 12px;flex-wrap:wrap;gap:8px}
.hello h1{margin:0;font-size:22px;font-weight:600}.hello p{margin:2px 0 0;color:var(--mut);font-size:13px}
.ctl{display:flex;gap:6px;flex-wrap:wrap}
select{font-family:inherit;font-size:13px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:7px 12px}
.grid{display:grid;gap:12px;margin-top:12px}.k4{grid-template-columns:repeat(4,1fr)}.c2{grid-template-columns:1.25fr 1fr}.c3{grid-template-columns:repeat(3,1fr)}
.card{background:var(--card);border-radius:18px;padding:16px;border:1px solid var(--line);min-width:0}
.card h3{margin:0 0 8px;font-size:15px;font-weight:600;display:flex;justify-content:space-between;gap:8px}.card h3 small{color:var(--mut);font-weight:400;font-size:12px}
.lab{color:var(--mut);font-size:12.5px}.big{font-size:27px;font-weight:700;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.up{color:var(--green);font-size:12px}.dn{color:var(--red);font-size:12px}
.kpi{display:flex;justify-content:space-between;gap:8px;overflow:hidden}.kpi>div{min-width:0}.kpi svg{flex:none;max-width:40%}
@media(max-width:600px){.kpi{flex-direction:column;align-items:stretch;gap:6px}.kpi svg{max-width:100%;width:100%;height:22px}.big{font-size:23px}.card{padding:13px}}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}.row:first-of-type{border-top:0}
.av{width:28px;height:28px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-weight:600;color:var(--navy);font-size:12px;flex:none}
.row .n{flex:1;min-width:0}.row .n div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row .n small{display:block;color:var(--mut);font-size:11.5px}
.mb{height:7px;border-radius:9px;background:var(--chip);margin-top:4px;overflow:hidden}.mb i{display:block;height:100%;background:var(--navy);border-radius:9px}
.tag{font-size:12px;border-radius:999px;padding:2px 9px;background:var(--chip);font-variant-numeric:tabular-nums;white-space:nowrap}
.tag.g{color:var(--green)}.tag.r{color:var(--red)}.tag.a{color:var(--amber)}
table{width:100%;border-collapse:collapse;font-size:13px}th{color:var(--mut);font-weight:500;text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap}
td{padding:8px 6px;border-bottom:1px solid var(--line)}td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow:auto;max-height:520px}
svg text{font-family:'IBM Plex Sans Thai',sans-serif}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--card);font-size:12px;padding:5px 9px;border-radius:8px;opacity:0;transition:opacity .1s;z-index:9}
.page{display:none}.page.on{display:block}
.note{color:var(--mut);font-size:12px;margin:10px 4px 0}
@media(max-width:900px){.k4{grid-template-columns:1fr 1fr}.c2,.c3{grid-template-columns:1fr}}
.ctl .tab{padding:7px 12px}
a{text-decoration:none}
.k3{grid-template-columns:repeat(3,1fr)}.k4{grid-template-columns:repeat(5,1fr)!important}
.ctl{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 4px}
.ctl select{max-width:100%;min-width:0;text-overflow:ellipsis}
.tab.line{background:#06c755;color:#fff;border-color:#06c755}
a.tab{text-decoration:none;display:inline-flex;align-items:center}
.dots{display:grid;grid-template-columns:repeat(20,1fr);gap:4px;margin-top:6px}.dots i{aspect-ratio:1;border-radius:50%;cursor:pointer}
.wh{font-size:13px;font-weight:700;margin:12px 0 6px}
.chip{display:inline-block;font-size:12px;background:var(--soft);border-radius:999px;padding:3px 10px;margin:0 4px 4px 0;cursor:pointer}.chip.more{background:var(--chip);color:var(--navy);font-weight:700}
.ok{font-size:12px;color:var(--green)}
.srch{font:inherit;width:100%;max-width:320px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);margin-bottom:8px}
td a{color:var(--navy);font-weight:600;text-decoration:none}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:12px;font-size:13px;opacity:0;transition:opacity .2s;z-index:10;pointer-events:none}
@media(max-width:1100px){.k4{grid-template-columns:repeat(3,1fr)!important}}
@media(max-width:900px){.k3{grid-template-columns:1fr}}
@media(max-width:600px){.k4{grid-template-columns:1fr 1fr!important}.ctl{display:grid;grid-template-columns:1fr 1fr}.ctl select,.ctl .tab{width:100%}#fTM,#bLine{grid-column:1/-1}.dots{grid-template-columns:repeat(14,1fr)}}

/* ===== mint skin 30/10/2026 (look only — logic unchanged) ===== */
:root{--bg:#e3f4ee;--card:#fff;--ink:#16201c;--mut:#6d7a74;--line:#e7ece9;--navy:#12a37f;--red:#e0483f;--green:#12a37f;--amber:#e5932b;--soft:#f6f8f7;--chip:#e3f5ee;--hatch:#e4ebe8;--blk:#111816}

body{background:radial-gradient(1200px 500px at 85% -10%,#bfe9da 0,transparent 60%),radial-gradient(900px 500px at 0% 110%,#cdeee2 0,transparent 55%),var(--bg);min-height:100vh}

.wrap{padding:20px}
.frame{background:var(--soft);border:6px solid rgba(255,255,255,.55);border-radius:28px;padding:20px;box-shadow:0 20px 60px rgba(18,80,60,.10)}
.seg{display:flex;gap:2px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}

.seg .tab.on{background:var(--blk);color:var(--card)}
.logo{background:transparent;padding:0}

.card h3{font-weight:500}
.big{font-weight:600;font-size:30px;letter-spacing:-.5px}
.up,.dn{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:500}
.up{background:#e3f5ee;color:#0c7d61}.dn{background:#fdecea;color:#c23a32}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .up{background:#173a2f;color:#5fe0b1}:root:not([data-theme=light]) .dn{background:#3d1f1d;color:#ff8a82}}
:root[data-theme=dark] .up{background:#173a2f;color:#5fe0b1}:root[data-theme=dark] .dn{background:#3d1f1d;color:#ff8a82}
.mb{height:10px;background:repeating-linear-gradient(45deg,var(--hatch) 0 3px,transparent 3px 7px)}.mb i{background:var(--green)}
.tag{background:var(--chip)}.tag.g{background:#e3f5ee}.tag.r{background:#fdecea}.tag.a{background:#fdf1e1}
select,.srch,.ctl .tab{background:var(--card);border-color:var(--line)}
.ctl .tab.on{background:var(--blk);color:var(--card);border-color:var(--blk)}
.tab.line{background:#06c755;color:#fff;border-color:#06c755}
th{font-weight:400}tbody tr:hover td,tr:hover td{background:var(--soft)}
td a{color:var(--green)}
.hello h1{font-weight:500;font-size:24px}
@media(max-width:600px){.wrap{padding:8px}.frame{padding:12px;border-width:3px;border-radius:20px}.big{font-size:24px}.seg{width:100%}.seg .tab{flex:1;padding:7px 8px}}
.tw{max-height:72vh;overflow:auto;-webkit-overflow-scrolling:touch}
th{position:sticky;top:0;z-index:2;background:var(--card);box-shadow:inset 0 -1px 0 var(--line)}
/* fluid: scale with screen 30/10 */
html{font-size:clamp(13px,0.55vw + 8px,18px)}body{font-size:1rem}
.wrap{max-width:min(96vw,2200px)}
.big{font-size:clamp(22px,1.5vw + 8px,40px)}.lab,.card h3 small{font-size:.9rem}.card h3{font-size:1.07rem}
.tab,select,.srch,table,.tag,.chip{font-size:.93rem}.hello h1{font-size:clamp(20px,1.2vw + 10px,32px)}

const INC_AP=[[60,270],[50,250],[40,220],[20,200],[0,150]], INC_AN=[[60,150],[50,140],[40,130],[30,120],[0,100]];
const INC_MG={TM:{ap:25,an:10,insS:10,insD:20},HUB:{ap:12.5,an:5,insS:5,insD:10},AM:{ap:5,an:2.5,insS:2,insD:5}};
const incRate=(T,n)=>{for(const[t,v]of T)if(n>=t)return v};
const incNext=(T,n)=>{let b=null;for(const x of T)if(x[0]>n)b=x;return b};
function incCK(o){
 const ra=incRate(INC_AP,o.ap),rn=incRate(INC_AN,o.an),mo=o.ap+o.an,ins=o.ia+o.in_,pct=mo?ins/mo:0,fac=(mo>0&&pct<0.6)?0.5:1;
 const contract=o.ap*ra+o.an*rn+(o.pos==='Agent'?0:o.el*100),insAmt=o.ia*100+o.in_*50;
 let nx=null;
 [['Apple',INC_AP,o.ap,ra],['Android',INC_AN,o.an,rn]].forEach(([k,T,n,r])=>{const x=incNext(T,n);if(x){const need=x[0]-n,gain=((n+need)*x[1]-n*r)*fac;if(!nx||need<nx.need||(need===nx.need&&gain>nx.gain))nx={k,need,gain,rate:x[1]}}});
 return{ra,rn,mo,pct,fac,contract,insAmt,total:(contract+insAmt)*fac,nx};
}
function incMG(role,o){const c=INC_MG[role];const contract=o.ap*c.ap+o.an*c.an,insAmt=o.insS*c.insS+o.insD*c.insD;return{contract,insAmt,total:contract+insAmt}}

  const base={ap:q.ap,an:q.an,el:q.el,ia:q.ia,in_:q.in_,pos},c=incCK(base);

 const G={tm:{},hub:{},am:{}};
 const ent=(g,k,init)=>g[k]||(g[k]=Object.assign({ap:0,an:0,insS:0,insD:0,iaS:0,inS:0,iaD:0,inD:0,nS:0,nD:0},init));
 rows.forEach(r=>{const ts=r.team_short||'-',b=bkt(r),lead=!!r.is_leader_as_mkt,mo=isMo(r),ins=mo&&(r.protected_amt||0)>0;
  const hubK=TEAM_HUB[ts],amK=amOf(ts)||r.region_manager_fullname||'';
  const mk=nm(r.marketing_fullname||''),own=lead||LEAD.has(mk),O=()=>({own:{ap:0,an:0,el:0,ia:0,in_:0,n:0}});
  const tgt=[['tm',ts,Object.assign({tl:r.team_leader_fullname||'',who:nm(r.team_leader_fullname||'')},O())]];
  if(hubK)tgt.push(['hub',hubK,Object.assign({who:HUB_INFO[hubK]?nm(HUB_INFO[hubK].rm):''},O())]);if(amK)tgt.push(['am',amK,Object.assign({who:''},O())]);
  tgt.forEach(([g,k,init])=>{const e=ent(G[g],k,init);
   if(own&&e.who&&mk===e.who){if(b==='emp'){const o=e.own;if(mo){o[incMon(r)]++;if(ins)o[incMon(r)==='ap'?'ia':'in_']++}else if(r.sub_product_type_code==='01')o.el++;o.n++}return}
   if(b==='emp'){e.nS++;if(mo)e[incMon(r)]++;if(ins){e.insS++;e[incMon(r)==='ap'?'iaS':'inS']++}}else if(b==='dlr'){e.nD++;if(ins){e.insD++;e[incMon(r)==='ap'?'iaD':'inD']++}}});
 });

  const row=Object.assign({key:k},label(k,e),{'Apple (พนักงาน)':e.ap,'Android (พนักงาน)':e.an,'เคสพนักงาน':e.nS,'เคส Dealer Staff':e.nD,'ประกัน พนง.':e.insS,'ประกัน Dealer':e.insD,'ประกัน Apple (พนง.)':e.iaS,'ประกัน Android (พนง.)':e.inS,'ประกัน Apple (Dealer)':e.iaD,'ประกัน Android (Dealer)':e.inD,'ค่าสัญญา':c.contract,'ค่าประกัน':c.insAmt});
  let tot=c.total,ptot=pr.total;
  if(role!=='AM'){const o=e.own,oc=incCK(Object.assign({pos:'Checker'},o)),opr=incCK({pos:'Checker',ap:sk(o.ap),an:sk(o.an),el:sk(o.el),ia:sk(o.ia),in_:sk(o.in_)});row['ทำเอง (เรท Checker)']=oc.total;row['เคสทำเอง']=o.n;tot+=oc.total;ptot+=opr.total}
  row['รวม']=tot;row['คาดสิ้นเดือน']=ptot;out[g].push(row)});
 mgRows('tm','TM',(k,e)=>({'ทีม':sh(k),'หัวหน้าทีม (TM)':nk(e.tl)}));
