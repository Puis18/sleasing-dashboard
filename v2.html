const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function un(pw){const raw=b64(P),salt=raw.slice(0,16),iv=raw.slice(16,28),ct=raw.slice(28);
const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct);
const html=await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream('deflate'))).text();
try{sessionStorage.setItem('slpw',pw)}catch(_){}
document.open();document.write(html);document.close();}
document.getElementById('f').addEventListener('submit',async ev=>{ev.preventDefault();const e=document.getElementById('e');e.textContent='กำลังตรวจสอบ...';
try{await un(document.getElementById('pw').value)}catch(x){e.textContent='รหัสผ่านไม่ถูกต้อง';}});
(async()=>{let s='';try{s=sessionStorage.getItem('slpw')||''}catch(_){}if(s){try{await un(s)}catch(_){try{sessionStorage.removeItem('slpw')}catch(__){}}}})();
</script></body></html>
